[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adzuna-etl"
version = "0.1.0"
description = "ETL pipeline that extracts job ads from the Adzuna API, cleans and validates them, and loads them to CSV. Designed to scale to incremental data-warehouse loads and SCD dimensional modelling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["etl", "adzuna", "jobs", "data-engineering", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "pandas>=2.0,<3",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Future phases (data warehouse / analytical layer). Opt-in later with:
#   uv sync --extra dw
dw = [
    "duckdb>=0.10",
    "pyarrow>=15.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
# Installed by default with `uv sync` (used for EDA notebooks + tests).
dev = [
    "ipykernel>=6.29",
    "jupyter-core>=5.7",
    "matplotlib>=3.8",
    "nbconvert>=7.14",
    "nbformat>=5.9",
    "pytest>=8.0",
    "seaborn>=0.13",
]

[project.scripts]
adzuna-etl = "adzuna_etl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adzuna_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100